[build]
	command = "npm run seo:generate"
	functions = "netlify/functions"
	publish = "."

[[redirects]]
	from = "/insights"
	to = "/insights/index.html"
	status = 200

[[redirects]]
	from = "/insights/"
	to = "/insights/index.html"
	status = 200

[[redirects]]
	from = "/insights/*"
	to = "/insights/article.html"
	status = 200

[[redirects]]
	from = "/investment-opportunities"
	to = "/investment-opportunities/index.html"
	status = 200

[[redirects]]
	from = "/investment-opportunities/"
	to = "/investment-opportunities/index.html"
	status = 200

[[redirects]]
	from = "/investment-opportunities/*"
	to = "/investment-opportunities/index.html"
	status = 200

[[headers]]
	for = "/assets/*"
	[headers.values]
		Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
	for = "/*.html"
	[headers.values]
		Cache-Control = "public, max-age=0, must-revalidate"

[[redirects]]
	from = "/services/business-consulting"
	to = "/services/business-advisory/"
	status = 301
	force = true

[[redirects]]
	from = "/services/business-consulting/*"
	to = "/services/business-advisory/"
	status = 301
	force = true


